<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>Schema einer Tierzelle</title>
  <rect width="800" height="500" fill="#f8fafc"/>
  <!-- Zellmembran und Zellplasma -->
  <ellipse cx="400" cy="250" rx="360" ry="220" fill="#fde68a" stroke="#b45309" stroke-width="8"/>
  <!-- Zellkern mit Kernkörperchen -->
  <circle cx="520" cy="200" r="80" fill="#c4b5fd" stroke="#6d28d9" stroke-width="6"/>
  <circle cx="540" cy="190" r="22" fill="#6d28d9"/>
  <!-- Mitochondrien -->
  <g fill="#fca5a5" stroke="#b91c1c" stroke-width="5">
    <ellipse cx="220" cy="180" rx="60" ry="26" transform="rotate(-20 220 180)"/>
    <ellipse cx="260" cy="350" rx="55" ry="24" transform="rotate(15 260 350)"/>
    <ellipse cx="560" cy="370" rx="50" ry="22" transform="rotate(-10 560 370)"/>
  </g>
  <!-- Vesikel -->
  <g fill="#93c5fd" stroke="#1d4ed8" stroke-width="4">
    <circle cx="380" cy="120" r="16"/>
    <circle cx="400" cy="390" r="14"/>
    <circle cx="150" cy="270" r="12"/>
  </g>
</svg>
